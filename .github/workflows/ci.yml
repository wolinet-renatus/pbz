name: PBZ LMS - CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  laravel-ci:
    name: Build, Lint & Test (PHP 8.3 & Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, curl, libxml, zip, bcmath, pdo, pdo_sqlite, pdo_mysql, gd, intl
          coverage: none
          tools: composer:v2

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Prepare Test Environment
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Run Code Style Check (Laravel Pint)
        run: |
          if [ -f "vendor/bin/pint" ]; then
            vendor/bin/pint --test
          else
            echo "Laravel Pint not installed, skipping style check."
          fi
        continue-on-error: true

      - name: Execute Automated Test Suite (PHPUnit)
        run: |
          vendor/bin/phpunit --no-coverage
