<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="eGrad_bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041a10"/>
      <stop offset="60%" stop-color="#004d27"/>
      <stop offset="100%" stop-color="#012b16"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#eGrad_bot)"/>

  <!-- Zanzibar Coastal Dhow Outline in Background -->
  <g opacity="0.09" stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M500,320 Q620,340 740,320 C720,360 520,360 500,320 Z"/>
    <path d="M620,160 L620,320 M620,160 L540,300 L620,300 M620,180 L710,290 L620,290"/>
    <circle cx="680" cy="140" r="40"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(50, 45)">
    <rect width="200" height="34" rx="17" fill="#32C5F1" fill-opacity="0.2" stroke="#32C5F1" stroke-width="1"/>
    <circle cx="20" cy="17" r="6" fill="#32C5F1"/>
    <text x="34" y="22" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">RETAIL BANKING</text>
  </g>

  <!-- Title & Description -->
  <g transform="translate(50, 125)">
    <text x="0" y="35" font-family="'Inter', system-ui, sans-serif" font-size="32" font-weight="900" fill="#ffffff">PBZ Wakala Agent Banking Forum</text>
    <text x="0" y="80" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#32C5F1">Expanding Financial Inclusion across Unguja & Pemba</text>
    
    <g transform="translate(0, 140)">
      <!-- Date -->
      <g>
        <circle cx="20" cy="20" r="20" fill="#ffffff" fill-opacity="0.1"/>
        <text x="50" y="16" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">DATE &amp; TIME</text>
        <text x="50" y="34" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Jan 18, 2027</text>
      </g>
      <!-- Location -->
      <g transform="translate(300, 0)">
        <circle cx="20" cy="20" r="20" fill="#ffffff" fill-opacity="0.1"/>
        <text x="50" y="16" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">VENUE</text>
        <text x="50" y="34" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Stone Town Convention Centre</text>
      </g>
    </g>

    <g transform="translate(0, 240)">
      <rect width="220" height="46" rx="8" fill="#006837" stroke="#32C5F1" stroke-width="1.5"/>
      <text x="30" y="28" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">REGISTER FOR SUMMIT</text>
    </g>
  </g>
</svg>