<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ev1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140b"/>
      <stop offset="60%" stop-color="#004d27"/>
      <stop offset="100%" stop-color="#062816"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9ED27"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#ev1Bg)"/>

  <!-- Event Badge -->
  <g transform="translate(50, 45)">
    <rect width="180" height="34" rx="17" fill="#ffffff" opacity="0.12"/>
    <circle cx="20" cy="17" r="7" fill="#F9ED27"/>
    <text x="36" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#32C5F1">EXECUTIVE FORUM</text>
    <rect x="195" y="0" width="140" height="34" rx="17" fill="url(#gold)"/>
    <text x="210" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#041a10">ZANZIBAR 2026</text>
  </g>

  <!-- Typography -->
  <g transform="translate(50, 150)">
    <text font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#32C5F1" letter-spacing="3">BANK OF TANZANIA &amp; PBZ DIALOGUE</text>
    <text y="48" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff">
      <tspan x="0" dy="0">Annual PBZ Regulatory Compliance</tspan>
      <tspan x="0" dy="44" fill="url(#gold)">&amp; BOT Risk Forum 2026</tspan>
    </text>

    <text y="145" font-family="'Inter', sans-serif" font-size="16" fill="#cbe2d6">
      Keynote Addresses by BOT Regulators, FIU Tanzania, and PBZ Executive Risk Leadership.
    </text>

    <g transform="translate(0, 185)">
      <rect width="260" height="36" rx="8" fill="#ffffff" opacity="0.12"/>
      <text x="15" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff">📍 PBZ Training Centre, Mpirani</text>

      <rect x="275" width="160" height="36" rx="8" fill="#ffffff" opacity="0.12"/>
      <text x="290" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff">📅 November 24, 2026</text>
    </g>
  </g>

  <!-- Crest -->
  <g transform="translate(680, 270)">
    <circle r="75" fill="#072818" stroke="url(#gold)" stroke-width="4"/>
    <text text-anchor="middle" y="5" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#32C5F1">BOT</text>
    <text text-anchor="middle" y="25" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F9ED27">FORUM</text>
  </g>
</svg>
