<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041a10"/>
      <stop offset="50%" stop-color="#006837"/>
      <stop offset="100%" stop-color="#072818"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9ED27"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#32C5F1"/>
      <stop offset="100%" stop-color="#0080b0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)"/>
  
  <!-- Subtle Guilloche security pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="700" cy="100" r="160"/>
    <circle cx="700" cy="100" r="120"/>
    <circle cx="700" cy="100" r="80"/>
    <rect x="620" y="20" width="160" height="160" transform="rotate(45 700 100)"/>
  </g>

  <!-- PBZ Academy Badge -->
  <g transform="translate(50, 45)">
    <rect width="180" height="34" rx="17" fill="#ffffff" opacity="0.12"/>
    <circle cx="20" cy="17" r="7" fill="#F9ED27"/>
    <text x="36" y="22" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#32C5F1" letter-spacing="1">PBZ DIPLOMA TRACK</text>
    <rect x="200" y="0" width="140" height="34" rx="17" fill="url(#goldGrad)"/>
    <text x="216" y="22" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="800" fill="#041a10" letter-spacing="0.5">DUAL ACCREDITED</text>
  </g>

  <!-- Typography -->
  <g transform="translate(50, 150)">
    <text font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#32C5F1" letter-spacing="3">EXECUTIVE PROFESSIONAL TRACK</text>
    <text y="48" font-family="'Inter', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" line-height="1.2">
      <tspan x="0" dy="0">Certified Compliance &amp;</tspan>
      <tspan x="0" dy="44" fill="url(#goldGrad)">Cyber Risk Specialist (CCCRS)</tspan>
    </text>
    
    <text y="145" font-family="'Inter', system-ui, sans-serif" font-size="16" fill="#d1e5db">
      Comprehensive 2-Course Curriculum: BOT AML/KYC Directives + Banking Threat Defense
    </text>

    <!-- Meta pills -->
    <g transform="translate(0, 185)">
      <rect width="150" height="36" rx="8" fill="#ffffff" opacity="0.1"/>
      <text x="20" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff">2 Full Courses</text>

      <rect x="165" width="160" height="36" rx="8" fill="#ffffff" opacity="0.1"/>
      <text x="185" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff">2 Verified Certs</text>

      <rect x="340" width="170" height="36" rx="8" fill="#32C5F1" opacity="0.2"/>
      <text x="355" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#32C5F1">24 CPD Credits</text>
    </g>
  </g>

  <!-- Diploma Seal Emblem -->
  <g transform="translate(670, 310)">
    <circle r="75" fill="#072818" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle r="65" fill="#004d27" stroke="#32C5F1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text text-anchor="middle" y="-15" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#F9ED27" letter-spacing="1">PBZ SOVEREIGN</text>
    <text text-anchor="middle" y="6" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#ffffff">DIPLOMA</text>
    <text text-anchor="middle" y="25" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#32C5F1">BOT ALIGNED</text>
  </g>
</svg>
